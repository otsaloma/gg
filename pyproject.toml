[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gg"
dynamic = ["version"]
description = "R's ggplot2 Plotting for Dataiter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.1.0"
authors = [{ name = "Osmo Salomaa", email = "otsaloma@iki.fi" }]

[project.urls]
Homepage = "https://github.com/otsaloma/gg"

[tool.hatch.version]
path = "gg.py"

[tool.hatch.build.targets.sdist]
include = ["gg.py"]
